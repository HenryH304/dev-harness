services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "${PORT:-9080}:9080"
    environment:
      - PORT=${PORT:-9080}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite:///data/devharness.db
      - HOME=${HOME_DIR:-/home/henry}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-DevHarness}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-devharness@local}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-DevHarness}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-devharness@local}
    volumes:
      - sqlite-data:/app/data
      - ${PROJECTS_DIR:-/home/henry/Projects}:${PROJECTS_DIR:-/home/henry/Projects}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sqlite-data:
