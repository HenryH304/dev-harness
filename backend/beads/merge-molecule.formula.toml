formula = "merge-molecule"
description = "Merger agent workflow: fetch, rebase, test, push, and clean up a feature branch merge."
version = 1
type = "workflow"

[metadata]
execution_agent_type = "merger"

[vars.ticket_id]
description = "The ticket ID being merged (e.g. bd-42)"
required = true

[[steps]]
id = "fetch-main"
title = "Fetch latest main for {{ticket_id}}"
description = """
Fetch the latest state of the main branch from origin.

```bash
git fetch origin main
```

Verify the remote is reachable and the fetch succeeds before proceeding.
"""

[[steps]]
id = "rebase"
title = "Rebase {{ticket_id}} onto main"
needs = ["fetch-main"]
description = """
Rebase the feature branch onto the freshly fetched main.

```bash
git rebase origin/main
```

If conflicts arise, create one child bead per conflicting file:
  bd create resolve-conflict:<filename> --parent <rebase-bead-id>
Resolve each file, close its bead, and push before continuing.
"""

[[steps]]
id = "run-tests"
title = "Run tests for {{ticket_id}}"
needs = ["rebase"]
description = """
Run the full test suite to verify the rebased branch is green.

```bash
make test
```

Fix any failures before proceeding. Do not proceed with a red test suite.
"""

[[steps]]
id = "merge-push"
title = "Merge and push {{ticket_id}}"
needs = ["run-tests"]
description = """
Merge the branch into main and push.

```bash
git checkout main
git merge --no-ff <branch>
git push origin main
```

If the push is rejected (someone else merged), re-run from fetch-main.
"""

[[steps]]
id = "cleanup"
title = "Clean up after merging {{ticket_id}}"
needs = ["merge-push"]
description = """
Remove the feature branch and clean up beads state.

```bash
git branch -d <branch>
git push origin --delete <branch>
bd dolt push
rm -rf .beads/
```

Only close this bead and write <promise>COMPLETE</promise> after cleanup succeeds.
"""
